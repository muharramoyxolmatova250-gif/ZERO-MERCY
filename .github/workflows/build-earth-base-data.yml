name: Build ZERO MERCY Earth base data

on:
  push:
    paths:
      - ".github/workflows/build-earth-base-data.yml"
      - "tools/geodata/download_natural_earth.py"
      - "tools/geodata/build_global_manifest.py"
  workflow_dispatch:
    inputs:
      detail:
        description: "Natural Earth map detail"
        required: true
        type: choice
        options: ["50m", "110m", "all"]
        default: "50m"
  schedule:
    - cron: "17 4 1 * *"

permissions:
  contents: write

concurrency:
  group: zero-mercy-earth-base-data
  cancel-in-progress: false

jobs:
  build-earth-base:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout ZERO MERCY
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and validate global country geometry
        run: |
          python tools/geodata/download_natural_earth.py --scale "${{ inputs.detail || '50m' }}"
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path("data/geodata").glob("world-*.geojson"))
          assert files, "No world country GeoJSON was generated."
          for path in files:
              data = json.loads(path.read_text(encoding="utf-8"))
              features = data.get("features", [])
              assert data.get("type") == "FeatureCollection" and len(features) > 100, path
              print(f"{path}: {len(features)} map features, {path.stat().st_size:,} bytes")
          PY
      - name: Build global OSM regional source catalogue
        run: python tools/geodata/build_global_manifest.py
      - name: Commit generated base map data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geodata/world-*.geojson data/world/global_regions.json
          if git diff --cached --quiet; then
            echo "Global map data is already current."
          else
            git commit -m "Build global Earth country map data"
            git push
          fi
