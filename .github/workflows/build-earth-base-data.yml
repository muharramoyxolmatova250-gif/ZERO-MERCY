name: Build ZERO MERCY Earth base data

on:
  push:
    paths:
      - ".github/workflows/build-earth-base-data.yml"
      - "tools/geodata/download_natural_earth.py"
      - "tools/geodata/build_global_manifest.py"
      - "tools/geodata/build_global_country_queue.py"
      - "tests/test_global_country_queue.py"
      - "tests/test_global_tile_grid.py"
      - "tests/test_global_build_state.py"
      - "tests/test_etopo_tile_index.py"
      - "tools/geodata/select_global_country_batch.py"
      - "tools/geodata/advance_global_country_batch.py"
      - "tools/geodata/rebuild_global_runtime_index.py"
  workflow_dispatch:
    inputs:
      detail:
        description: "Natural Earth map detail"
        required: true
        type: choice
        options: ["50m", "110m", "all"]
        default: "110m"
  schedule:
    - cron: "17 4 1 * *"

permissions:
  contents: write

concurrency:
  group: zero-mercy-repository-data-build
  cancel-in-progress: false

jobs:
  build-earth-base:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout ZERO MERCY
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and validate global base geography
        run: |
          python tools/geodata/download_natural_earth.py --scale "${{ inputs.detail || '110m' }}" --reuse-existing --hydrography
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path("data/geodata").glob("world-*.geojson"))
          assert files, "No world country GeoJSON was generated."
          for path in files:
              data = json.loads(path.read_text(encoding="utf-8"))
              features = data.get("features", [])
              minimum = 100 if path.name in {"world-110m.geojson", "world-50m.geojson"} else 1
              assert data.get("type") == "FeatureCollection" and len(features) >= minimum, path
              print(f"{path}: {len(features)} features, {path.stat().st_size:,} bytes")
          PY
      - name: Build global OSM regional source catalogue
        run: python tools/geodata/build_global_manifest.py
      - name: Build country extract queue and test it
        run: |
          python tools/geodata/build_global_country_queue.py
          python tests/test_global_country_queue.py
          python tests/test_global_tile_grid.py
          python tests/test_global_build_state.py
          python tests/test_etopo_tile_index.py
      - name: Commit generated base map data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geodata/world-*.geojson data/world/global_regions.json data/world/global_country_queue.json
          if git diff --cached --quiet; then
            echo "Global map data is already current."
          else
            git commit -m "Build global Earth country map data"
            branch="${GITHUB_REF_NAME:-main}"
            pushed=false
            for attempt in 1 2 3 4 5; do
              git fetch origin "$branch"
              git rebase "origin/$branch"
              if git push origin "HEAD:$branch"; then
                pushed=true
                break
              fi
              echo "Base-data push raced with another commit (attempt $attempt); retrying..."
              sleep $((attempt * 3))
            done
            if [ "$pushed" != true ]; then
              echo "Could not push validated base map data after 5 attempts." >&2
              exit 1
            fi
          fi
