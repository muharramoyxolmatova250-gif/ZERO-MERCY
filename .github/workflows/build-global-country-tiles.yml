name: Build global ZERO MERCY country tiles

on:
  workflow_dispatch:
    inputs:
      region_id:
        description: Exact Geofabrik region ID from data/world/global_country_queue.json
        required: true
        type: string
      bbox:
        description: "Region bounds: west,south,east,north (decimal degrees)"
        required: true
        type: string
      tile_degrees:
        description: Tile width in degrees (keep small for large countries)
        required: true
        default: "0.05"
        type: string
      tile_start:
        description: First tile job index
        required: true
        default: "0"
        type: string
      tile_count:
        description: Maximum tiles in this run
        required: true
        default: "8"
        type: string

permissions:
  contents: write

concurrency:
  group: zero-mercy-global-osm-${{ inputs.region_id }}
  cancel-in-progress: false

jobs:
  build-country-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout ZERO MERCY
        uses: actions/checkout@v4
      - name: Install Osmium
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          osmium --version
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh worldwide Geofabrik catalogue and country queue
        run: |
          python tools/geodata/build_global_manifest.py
          python tools/geodata/build_global_country_queue.py
      - name: Download selected country extract
        env:
          REGION_ID: ${{ inputs.region_id }}
        run: |
          python - <<'PY'
          import json, os, sys
          queue=json.load(open("data/world/global_country_queue.json", encoding="utf-8"))
          ids={x["id"] for x in queue["countries"]}
          rid=os.environ["REGION_ID"]
          if rid not in ids:
              raise SystemExit(f"{rid!r} is not a selected country-level extract. See data/world/global_country_queue.json")
          PY
          python tools/geodata/build_global_manifest.py --region "${REGION_ID}" --download
      - name: Plan bounded geographic tile batch
        env:
          REGION_ID: ${{ inputs.region_id }}
          BBOX: ${{ inputs.bbox }}
          TILE_DEGREES: ${{ inputs.tile_degrees }}
        run: |
          python - <<'PY'
          import os, subprocess
          bbox=[x.strip() for x in os.environ["BBOX"].split(",")]
          if len(bbox)!=4: raise SystemExit("bbox must be west,south,east,north")
          rid=os.environ["REGION_ID"]
          safe=rid.replace("/", "_")
          subprocess.run([
            "python","tools/geodata/plan_region_tiles.py","--region",safe,
            "--bbox",*bbox,"--tile-deg",os.environ["TILE_DEGREES"],
            "--anchor",str((float(bbox[0])+float(bbox[2]))/2),
                         str((float(bbox[1])+float(bbox[3]))/2),
            "--tile-size-m","4000",
            "--output",f"data/world/tile_jobs/{safe}.json",
            "--index-output","data/world/region_tiles.json"
          ],check=True)
          PY
      - name: Process and validate this bounded tile batch
        env:
          REGION_ID: ${{ inputs.region_id }}
          TILE_START: ${{ inputs.tile_start }}
          TILE_COUNT: ${{ inputs.tile_count }}
        run: |
          SAFE_REGION="${REGION_ID//\\//_}"
          python tools/geodata/process_region_tiles.py \
            "data/osm/pbf/${SAFE_REGION}.osm.pbf" \
            "data/world/tile_jobs/${SAFE_REGION}.json" \
            --start "${TILE_START}" --count "${TILE_COUNT}"
          python tools/geodata/validate_osm_tile_batch.py \
            "data/world/tile_jobs/${SAFE_REGION}.json" \
            --start "${TILE_START}" --count "${TILE_COUNT}" \
            --index data/world/region_tiles.json
      - name: Commit verified country tiles
        run: |
          SAFE_REGION="${{ inputs.region_id }}"
          SAFE_REGION="${SAFE_REGION//\\//_}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/world/global_regions.json data/world/global_country_queue.json data/world/region_tiles.json "data/world/tile_jobs/${SAFE_REGION}.json" "data/osm/tiles/${SAFE_REGION}/"
          if git diff --cached --quiet; then
            echo "No changed tiles in this batch."
          else
            git commit -m "Build verified global OSM tiles for ${SAFE_REGION}"
            git pull --rebase origin "${GITHUB_REF_NAME:-main}"
            git push origin "HEAD:${GITHUB_REF_NAME:-main}"
          fi
