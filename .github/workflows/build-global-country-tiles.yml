name: Build global ZERO MERCY country tiles

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-global-country-tiles.yml"
      - "tools/geodata/plan_region_tiles.py"
      - "tools/geodata/process_region_tiles.py"
      - "tools/geodata/validate_osm_tile_batch.py"
      - "tools/geodata/select_global_country_batch.py"
      - "tools/geodata/advance_global_country_batch.py"
      - "tools/geodata/rebuild_global_runtime_index.py"
      - "tools/geodata/download_etopo_tile.py"
      - "tools/geodata/convert_dem.py"
      - "tools/geodata/build_dem_tile_batch.py"
      - "tools/geodata/validate_dem_tile_batch.py"
      - "tools/geodata/build_osm_urban_tile_bboxes.py"
      - "tests/test_osm_urban_tile_bboxes.py"
      - "tests/test_global_tile_grid.py"
      - "tests/test_global_build_state.py"
      - "tests/test_global_country_queue.py"
      - "scripts/world/dem_terrain_tile.gd"
      - "scenes/world/dem_terrain_tile.tscn"
      - "tests/test_etopo_tile_index.py"
      - "tests/test_dem_conversion.py"
      - "scripts/world/region_streamer.gd"
      - "scripts/world/osm_region.gd"
  workflow_dispatch:
    inputs:
      region_id:
        description: Optional exact country extract ID; blank selects the next unfinished country
        required: false
        default: ""
        type: string
      tile_start:
        description: Optional tile offset; blank resumes saved progress
        required: false
        default: ""
        type: string
      tile_count:
        description: Tiles to process in this run
        required: false
        default: "16"
        type: string
      tile_degrees:
        description: Global grid tile width in degrees
        required: true
        default: "0.1"
        type: string
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows: ["Build ZERO MERCY Earth base data"]
    types: [completed]

permissions:
  contents: write

concurrency:
  # Shared lock with the Earth catalogue workflow; only one world-data writer runs at a time.
  # The saved cursor resumes the Andijan-priority Uzbekistan cells first, then all world regions.
  group: zero-mercy-country-tiles-recovery-v2
  cancel-in-progress: true

jobs:
  build-country-batch:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout ZERO MERCY
        uses: actions/checkout@v4
      - name: Install Osmium
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          osmium --version
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh worldwide catalogue and country queue
        run: |
          python tools/geodata/build_global_manifest.py
          python tools/geodata/build_global_country_queue.py
          python tests/test_global_country_queue.py
          python tests/test_global_tile_grid.py
          python tests/test_global_build_state.py
          python tests/test_etopo_tile_index.py
          python tests/test_osm_urban_tile_bboxes.py
      - name: Select next country batch
        id: select
        env:
          INPUT_REGION_ID: ${{ inputs.region_id || '' }}
          INPUT_TILE_START: ${{ inputs.tile_start || '' }}
          INPUT_TILE_COUNT: ${{ inputs.tile_count || '16' }}
        run: |
          python tools/geodata/select_global_country_batch.py \
            --region-id "$INPUT_REGION_ID" --tile-start "$INPUT_TILE_START" \
            --tile-count "$INPUT_TILE_COUNT" --output "$GITHUB_OUTPUT"
      - name: Restore cached country PBF
        if: steps.select.outputs.has_work == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/osm/pbf/${{ steps.select.outputs.safe_region }}.osm.pbf
          key: zero-mercy-pbf-v1-${{ steps.select.outputs.safe_region }}
      - name: Download selected country extract
        if: steps.select.outputs.has_work == 'true'
        env:
          REGION_ID: ${{ steps.select.outputs.region_id }}
        run: |
          python tools/geodata/build_global_manifest.py --region "$REGION_ID" --download
      - name: Cache country PBF for following batches
        if: steps.select.outputs.has_work == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/osm/pbf/${{ steps.select.outputs.safe_region }}.osm.pbf
          key: zero-mercy-pbf-v1-${{ steps.select.outputs.safe_region }}
      - name: Install raster DEM dependencies
        if: steps.select.outputs.has_work == 'true'
        run: |
          python -m pip install --disable-pip-version-check rasterio numpy
          python tests/test_dem_conversion.py
      - name: Restore cached ETOPO source tiles
        if: steps.select.outputs.has_work == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/terrain/source/
          key: zero-mercy-etopo15s-v1-${{ steps.select.outputs.safe_region }}-${{ steps.select.outputs.tile_start }}
          restore-keys: |
            zero-mercy-etopo15s-v1-${{ steps.select.outputs.safe_region }}-
      - name: Plan populated-place tiles in the shared global grid
        if: steps.select.outputs.has_work == 'true'
        env:
          REGION_ID: ${{ steps.select.outputs.region_id }}
          SAFE_REGION: ${{ steps.select.outputs.safe_region }}
          TILE_DEGREES: ${{ inputs.tile_degrees || '0.1' }}
        run: |
          python tools/geodata/build_osm_urban_tile_bboxes.py "data/osm/pbf/$SAFE_REGION.osm.pbf" \
            --queue data/world/global_country_queue.json --region-id "$REGION_ID" \
            --output "data/world/tile_jobs/urban_bboxes/$SAFE_REGION.json" --tile-deg "$TILE_DEGREES"
          python tools/geodata/plan_region_tiles.py --region "$SAFE_REGION" \
            --tile-deg "$TILE_DEGREES" --tile-size-m "$(python -c 'import os; print(float(os.environ["TILE_DEGREES"])*111320.0)')" \
            --anchor 72.3 40.7 --global-grid --merge-index \
            --bbox-file "data/world/tile_jobs/urban_bboxes/$SAFE_REGION.json" \
            --output "data/world/tile_jobs/$SAFE_REGION.json" \
            --index-output data/world/region_tiles.json
          python tools/geodata/rebuild_global_runtime_index.py
      - name: Process bounded tile batch
        if: steps.select.outputs.has_work == 'true'
        env:
          REGION_ID: ${{ steps.select.outputs.region_id }}
          SAFE_REGION: ${{ steps.select.outputs.safe_region }}
          TILE_START: ${{ steps.select.outputs.tile_start }}
          TILE_COUNT: ${{ steps.select.outputs.tile_count }}
        run: |
          python tools/geodata/process_region_tiles.py "data/osm/pbf/$SAFE_REGION.osm.pbf" \
            "data/world/tile_jobs/$SAFE_REGION.json" --start "$TILE_START" --count "$TILE_COUNT"
      - name: Build cropped global terrain batch
        if: steps.select.outputs.has_work == 'true'
        env:
          SAFE_REGION: ${{ steps.select.outputs.safe_region }}
          TILE_START: ${{ steps.select.outputs.tile_start }}
          TILE_COUNT: ${{ steps.select.outputs.tile_count }}
        run: |
          python tools/geodata/build_dem_tile_batch.py "data/world/tile_jobs/$SAFE_REGION.json" \
            --start "$TILE_START" --count "$TILE_COUNT" --source-dir data/terrain/source
      - name: Cache ETOPO source tiles for following batches
        if: steps.select.outputs.has_work == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/terrain/source/
          key: zero-mercy-etopo15s-v1-${{ steps.select.outputs.safe_region }}-${{ steps.select.outputs.tile_start }}
      - name: Validate terrain DEM batch
        if: steps.select.outputs.has_work == 'true'
        env:
          SAFE_REGION: ${{ steps.select.outputs.safe_region }}
          TILE_START: ${{ steps.select.outputs.tile_start }}
          TILE_COUNT: ${{ steps.select.outputs.tile_count }}
        run: |
          python tools/geodata/validate_dem_tile_batch.py "data/world/tile_jobs/$SAFE_REGION.json" \
            --start "$TILE_START" --count "$TILE_COUNT"
      - name: Validate tile batch and shared runtime index
        if: steps.select.outputs.has_work == 'true'
        env:
          SAFE_REGION: ${{ steps.select.outputs.safe_region }}
          TILE_START: ${{ steps.select.outputs.tile_start }}
          TILE_COUNT: ${{ steps.select.outputs.tile_count }}
        run: |
          python tools/geodata/validate_osm_tile_batch.py "data/world/tile_jobs/$SAFE_REGION.json" \
            --start "$TILE_START" --count "$TILE_COUNT" --index data/world/region_tiles.json
      - name: Advance persistent global build progress
        if: steps.select.outputs.has_work == 'true'
        env:
          REGION_ID: ${{ steps.select.outputs.region_id }}
          SAFE_REGION: ${{ steps.select.outputs.safe_region }}
          TILE_START: ${{ steps.select.outputs.tile_start }}
          TILE_COUNT: ${{ steps.select.outputs.tile_count }}
        run: |
          python tools/geodata/advance_global_country_batch.py --region-id "$REGION_ID" \
            --tile-start "$TILE_START" --tile-count "$TILE_COUNT" \
            --plan "data/world/tile_jobs/$SAFE_REGION.json"
      - name: Commit verified country tiles and progress
        if: steps.select.outputs.has_work == 'true'
        env:
          SAFE_REGION: ${{ steps.select.outputs.safe_region }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/world/global_build_state.json data/world/region_tiles.json \
            "data/world/tile_jobs/$SAFE_REGION.json" "data/world/tile_jobs/urban_bboxes/$SAFE_REGION.json" "data/osm/tiles/$SAFE_REGION/" \
            data/terrain/tiles/global/
          if git diff --cached --quiet; then
            echo "No changed tile outputs in this batch."
          else
            # Catalogue files are refreshed locally but owned and committed by the base workflow.
            git restore data/world/global_regions.json data/world/global_country_queue.json
            # Remove untracked extraction scratch; staged game tiles remain staged.
            git clean -fd
            git commit -m "Build verified global OSM tiles for $SAFE_REGION"
            git pull --rebase origin "${GITHUB_REF_NAME:-main}"
            git push origin "HEAD:${GITHUB_REF_NAME:-main}"
          fi
