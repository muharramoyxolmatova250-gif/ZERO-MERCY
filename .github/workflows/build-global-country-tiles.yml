name: Build global ZERO MERCY country tiles

on:
  workflow_dispatch:
    inputs:
      region_id:
        description: Exact country extract ID from global_country_queue.json
        required: true
        type: string
      tile_degrees:
        description: Geographic tile width in degrees
        required: true
        default: "0.05"
        type: string
      tile_start:
        description: First tile job index
        required: true
        default: "0"
        type: string
      tile_count:
        description: Maximum tiles to process in this run
        required: true
        default: "8"
        type: string

permissions:
  contents: write

concurrency:
  group: zero-mercy-global-osm-${{ inputs.region_id }}
  cancel-in-progress: false

jobs:
  build-country-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout ZERO MERCY
        uses: actions/checkout@v4
      - name: Install Osmium
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          osmium --version
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh global catalogue and country queue
        run: |
          python tools/geodata/build_global_manifest.py
          python tools/geodata/build_global_country_queue.py
      - name: Resolve country bounds and download extract
        env:
          REGION_ID: ${{ inputs.region_id }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          queue=json.load(open("data/world/global_country_queue.json", encoding="utf-8"))
          item=next((x for x in queue["countries"] if x["id"]==os.environ["REGION_ID"]), None)
          if item is None:
              raise SystemExit("Unknown country-level extract ID")
          bbox=item["bbox"]
          if len(bbox)!=4 or bbox[0]>=bbox[2] or bbox[1]>=bbox[3]:
              raise SystemExit("Country extract has invalid geographic bounds")
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as env:
              env.write("COUNTRY_BBOX="+",".join(map(str,bbox))+"\n")
          subprocess.run(["python","tools/geodata/build_global_manifest.py","--region",item["id"],"--download"],check=True)
          PY
      - name: Plan country tiles in the shared world coordinate frame
        env:
          REGION_ID: ${{ inputs.region_id }}
          TILE_DEGREES: ${{ inputs.tile_degrees }}
        run: |
          SAFE_REGION=$(printf '%s' "$REGION_ID" | tr '/' '_')
          IFS=',' read -r WEST SOUTH EAST NORTH <<< "$COUNTRY_BBOX"
          python tools/geodata/plan_region_tiles.py --region "$SAFE_REGION" \
            --bbox "$WEST" "$SOUTH" "$EAST" "$NORTH" --tile-deg "$TILE_DEGREES" \
            --anchor 0 0 --tile-size-m 4000 --merge-index \
            --output "data/world/tile_jobs/$SAFE_REGION.json" \
            --index-output data/world/region_tiles.json
      - name: Process and validate bounded tile batch
        env:
          REGION_ID: ${{ inputs.region_id }}
          TILE_START: ${{ inputs.tile_start }}
          TILE_COUNT: ${{ inputs.tile_count }}
        run: |
          SAFE_REGION=$(printf '%s' "$REGION_ID" | tr '/' '_')
          python tools/geodata/process_region_tiles.py "data/osm/pbf/$SAFE_REGION.osm.pbf" \
            "data/world/tile_jobs/$SAFE_REGION.json" --start "$TILE_START" --count "$TILE_COUNT"
          python tools/geodata/validate_osm_tile_batch.py "data/world/tile_jobs/$SAFE_REGION.json" \
            --start "$TILE_START" --count "$TILE_COUNT" --index data/world/region_tiles.json
      - name: Commit verified country tiles
        env:
          REGION_ID: ${{ inputs.region_id }}
        run: |
          SAFE_REGION=$(printf '%s' "$REGION_ID" | tr '/' '_')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/world/global_regions.json data/world/global_country_queue.json data/world/region_tiles.json \
            "data/world/tile_jobs/$SAFE_REGION.json" "data/osm/tiles/$SAFE_REGION/"
          if git diff --cached --quiet; then
            echo "No changed tiles in this batch."
          else
            git commit -m "Build verified global OSM tiles for $SAFE_REGION"
            git pull --rebase origin "${GITHUB_REF_NAME:-main}"
            git push origin "HEAD:${GITHUB_REF_NAME:-main}"
          fi
