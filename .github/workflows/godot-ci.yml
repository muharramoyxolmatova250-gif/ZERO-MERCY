name: ZERO MERCY Godot CI

on:
  push:
    branches: [main, world-build]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-smoke-test:
    name: Import and headless startup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Verify Godot version
        run: godot --version

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Run headless startup smoke test
        run: bash tests/run_godot_smoke.sh

      - name: Run carry hand IK geometry tests
        run: bash tests/run_godot_test.sh res://tests/test_carry_hand_ik.gd

      - name: Run NPC self-direction regression tests
        run: bash tests/run_godot_test.sh res://tests/test_npc_self_direction.gd

      - name: Run NPC animation event regression tests
        run: bash tests/run_godot_test.sh res://tests/test_npc_animation_events.gd

      - name: Run NPC social memory regression tests
        run: bash tests/run_godot_test.sh res://tests/test_npc_social_memory.gd

      - name: Run NPC family and household regression tests
        run: bash tests/run_godot_test.sh res://tests/test_world_family_system.gd

      - name: Run campaign progression integration test
        run: bash tests/run_godot_test.sh res://tests/test_mission_campaign.gd

      - name: Run core system integration smoke test
        run: bash tests/run_godot_test.sh res://tests/core_integration_smoke.gd
