name: Refresh global Earth map catalogue

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/refresh-global-earth-catalogue.yml"
      - "tools/geodata/build_global_manifest.py"
      - "tools/geodata/download_natural_earth.py"
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write

concurrency:
  group: refresh-global-earth-catalogue
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build worldwide OSM region catalogue
        run: python tools/geodata/build_global_manifest.py --output data/world/global_regions.json
      - name: Download public-domain world country boundaries (110m and 50m)
        run: python tools/geodata/download_natural_earth.py --scale all
      - name: Validate global boundary GeoJSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path("data/geodata").glob("world-*.geojson")):
              data = json.loads(path.read_text(encoding="utf-8"))
              assert data.get("type") == "FeatureCollection"
              assert len(data.get("features", [])) > 100
              print(f"{path}: {len(data['features'])} features")
          PY
      - name: Commit catalogue and world boundary data when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/world/global_regions.json data/geodata/world-110m.geojson data/geodata/world-50m.geojson
          if git diff --cached --quiet; then
            echo "Global region catalogue is already current."
          else
            git commit -m "Refresh global Earth map region catalogue"
            git push
          fi
